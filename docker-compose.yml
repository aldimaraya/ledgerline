services:
  ledgerline:
    # TrueNAS's Apps UI installs from a registry rather than building, so an image
    # reference is the portable form. Swap in `build: .` when iterating locally.
    image: ghcr.io/aldimaraya/ledgerline:latest
    # build: .
    container_name: ledgerline
    restart: unless-stopped

    # Locally, variables come from .env. TrueNAS's "Install via YAML" dialog has no .env
    # to read and no separate environment field, so there they have to be inlined --
    # uncomment the block below and delete env_file.
    env_file: .env
    # environment:
    #   ENCRYPTION_KEY: <openssl rand -hex 32>   # required; unrecoverable if lost
    #   TZ: UTC                                  # the 23:55 snapshot job uses this

    volumes:
      # The entire application state. On TrueNAS point the left side at a dataset,
      # e.g. /mnt/tank/apps/ledgerline/data:/data
      #
      # The container runs as uid 1000 (node), not root. A bind mount that Docker
      # creates for you is owned by root, and the app will start and then die opening
      # the database. Create the directories first and give them to 1000:1000.
      - ./data:/data
      - ./backups:/backups

    ports:
      # Host loopback only. Tailscale Serve runs on the host, connects to 127.0.0.1,
      # and publishes to the tailnet with a real certificate — so nothing needs to be
      # reachable from the LAN, let alone the internet.
      #
      # Changing this to "3000:3000" exposes your balances to every device on the
      # network. There is no login in front of it until Phase 4.
      - "127.0.0.1:3000:3000"

    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Nothing in this app needs to write outside the volume or gain privileges.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
