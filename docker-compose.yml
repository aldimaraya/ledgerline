services:
  ledgerline:
    build: .
    container_name: ledgerline
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      # Localhost only. Tailscale Serve puts it on the tailnet with a valid cert;
      # nothing here is reachable from the public internet.
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 60s
      timeout: 5s
      retries: 3
